# SwitchRes settings for RetroArch's per-game CRT modes. Lakka reads this from /storage/.config/retroarch/switchres.ini.
# RetroArch only uses the monitor below when crt_switch_resolution = "4" in retroarch.cfg.
monitor custom

# Fields: HfreqMin-HfreqMax, VfreqMin-VfreqMax, HFrontPorch, HSyncPulse, HBackPorch (µs), VFrontPorch, VSyncPulse, VBackPorch (ms),
#         HSyncPol, VSyncPol (0 = active low), ProgressiveLinesMin, ProgressiveLinesMax, InterlacedLinesMin, InterlacedLinesMax
# The horizontal porches match the RGB-Pi 320x240 timing in rgb-pi-crt.txt.
# The test TV rolls below about 55 Hz, so refresh starts at 57 Hz. Games slower than that run at 57 Hz, slightly fast.
# Line limits must fit HfreqMax / VfreqMin (16200 / 57 = 284 lines, including blanking), or SwitchRes ignores the range.
crt_range0 15625-16200, 57.00-65.00, 2.660, 4.690, 5.310, 0.064, 0.192, 1.024, 0, 0, 192, 256, 448, 512
