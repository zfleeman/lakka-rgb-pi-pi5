# SwitchRes settings for RetroArch's per-game CRT modes. Lakka reads this from /storage/.config/retroarch/switchres.ini.
# RetroArch only uses the monitor below when "CRT SwitchRes" is set to "Selected from ini" (crt_switch_resolution = "4").
monitor custom

# Fields: HfreqMin-HfreqMax, VfreqMin-VfreqMax, HFrontPorch, HSyncPulse, HBackPorch (µs), VFrontPorch, VSyncPulse, VBackPorch (ms),
#         HSyncPol, VSyncPol (0 = active low), ProgressiveLinesMin, ProgressiveLinesMax, InterlacedLinesMin, InterlacedLinesMax
# The horizontal porches match the RGB-Pi 320x240 timing. Line limits must fit HfreqMax / VfreqMin (lines including blanking),
# or SwitchRes ignores the range.

# Tested: a US (60 Hz) RGB-modded TV that rolls below about 55 Hz, so refresh starts at 57 Hz. Games slower than that run slightly fast.
crt_range0 15625-16200, 57.00-65.00, 2.660, 4.690, 5.310, 0.064, 0.192, 1.024, 0, 0, 192, 256, 448, 512

# Untested: for a European SCART TV that also syncs at 50 Hz (PAL games, 288p and 576i), use this line instead of the one above.
# crt_range0 15625-16200, 49.50-65.00, 2.660, 4.690, 5.310, 0.064, 0.192, 1.024, 0, 0, 192, 288, 448, 576
